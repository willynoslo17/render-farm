; Minimal hardening overrides for ZLMediaKit. Generate a secret with: openssl rand -hex 24  (never commit it)
[api]
secret=CHANGE_ME_NOT_COMMITTED
apiDebug=0
[general]
enableVhost=0
[hook]
enable=1
; on_publish must validate a stream key; point it at your n8n webhook
on_publish=https://ml-n8n.denmarkeast.cloudapp.azure.com/webhook/zlm-publish
[http]
dirMenu=0
