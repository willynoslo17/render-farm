name: remotion-render
on:
  repository_dispatch:
    types: [remotion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remotion-${{ github.run_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        working-directory: remotion
        run: npm ci
      - name: Render
        working-directory: remotion
        env:
          PROPS: ${{ toJson(github.event.client_payload.props) }}
        run: |
          if [ -z "$PROPS" ] || [ "$PROPS" = "null" ]; then
            PROPS='{"title":"Render test","subtitle":"Remotion on GitHub Actions","imageUrl":"","durationInFrames":90}'
          fi
          echo "$PROPS" | jq -e 'type=="object"' > props.json.check
          echo "$PROPS" > props.json
          npx remotion render src/index.ts Promo out.mp4 --props=props.json
      - name: Upload to Cloudinary (unsigned)
        id: up
        run: |
          RESP=$(curl -s -X POST https://api.cloudinary.com/v1_1/yiq9yzmu/video/upload \
            -F upload_preset=ml_unsigned -F file=@remotion/out.mp4)
          URL=$(echo "$RESP" | jq -r '.secure_url // empty')
          if [ -z "$URL" ]; then echo "Upload failed: $(echo "$RESP" | jq -c '.error // .')"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "secure_url=$URL"
      - name: Callback (allowlisted URLs only)
        if: ${{ github.event.client_payload.callback_url != '' }}
        env:
          CB_URL: ${{ github.event.client_payload.callback_url }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          OUT_URL: ${{ steps.up.outputs.url }}
        run: |
          case "$CB_URL" in
            https://ml-n8n.denmarkeast.cloudapp.azure.com/*|https://hook.eu1.make.com/*) ;;
            *) echo "Callback URL not in allowlist; skipping."; exit 0 ;;
          esac
          jq -n --arg job "$JOB_ID" --arg url "$OUT_URL" '{job:$job,url:$url}' | \
            curl -s --max-time 30 -X POST "$CB_URL" -H 'Content-Type: application/json' -d @-
